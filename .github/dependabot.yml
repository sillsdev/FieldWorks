# Dependabot configuration for FieldWorks
# Keeps GitHub Actions and other dependencies up-to-date

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Chore"
    labels:
      - "dependencies"
    # Group minor/patch updates to reduce PR noise
    groups:
      actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Chore"
    labels:
      - "dependencies"
    # Ignore major version bumps by default (breaking changes)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Microsoft.Extensions.DependencyModel is held at 9.0.16 by an observed
      # runtime break, not by any declared dependency range: 9.0.17 throws
      # TypeInitializationException on Icu.NativeMethods in the .NET Framework
      # test host (PR #1000). Every package that depends on it asks only for a
      # floor (ParatextData >= 9.0.9, icu.net and SIL.LCModel.Core >= 2.0.4), so
      # nothing in the package graph prevents a bump and Dependabot re-proposed
      # it in #1037 after #1000 reverted it. See the retest procedure in the
      # comment above the pin in Directory.Packages.props before removing this.
      - dependency-name: "Microsoft.Extensions.DependencyModel"
    groups:
      nuget-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
