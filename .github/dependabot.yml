# Dependabot configuration for FieldWorks
# Keeps GitHub Actions and other dependencies up-to-date

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Chore"
    labels:
      - "dependencies"
    # Group minor/patch updates to reduce PR noise
    groups:
      actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Chore"
    labels:
      - "dependencies"
    # Ignore major version bumps by default (breaking changes)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned at 9.0.16 due to TypeInitializationException on Icu.NativeMethods
      # in the net48 test host (PR #1000). Retest procedure: Directory.Packages.props.
      - dependency-name: "Microsoft.Extensions.DependencyModel"
    groups:
      nuget-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
