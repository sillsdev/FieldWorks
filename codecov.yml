# Codecov configuration (https://docs.codecov.com/docs/codecov-yaml)
# test.ps1 -Coverage collects both flags: managed via dotnet-coverage (flag "managed") and native
# C++ via OpenCppCoverage (flag "native"). CI excludes the LongRunning/ByHand/SmokeTest/
# DesktopRequired categories, so totals understate the full suite.

coverage:
  status:
    project:
      default:
        informational: true # report, but do not fail CI on total-coverage changes (yet)
    patch:
      default:
        informational: true # report diff coverage on PRs without gating merges (yet)

comment:
  layout: "condensed_header, diff, files"
  require_changes: true

ignore:
  - "**/*Tests/**" # test project sources; drop this if test-code coverage becomes interesting
  - "Src/Generic/Test/**" # native Unit++ test sources (covered by the native flag's test exes)
  - "Src/views/Test/**" # native Unit++ test sources (covered by the native flag's test exes)
